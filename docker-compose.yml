version: '3.8'

services:
  parrotcloud-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parrotcloud-workspace
    hostname: parrotcloud
    ports:
      - "3000:3000"   # Web UI and HTTP Gateway
      - "4000:4000"   # Web Terminal / WebSocket Server
      - "6080:6080"   # noVNC Graphical Desktop Display
    environment:
      - PORT=3000
      - WS_PORT=4000
      - VNC_PORT=6080
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:false
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - parrot-net

networks:
  parrot-net:
    driver: bridge
