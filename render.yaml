services:
  - type: web
    name: parrotcloud-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/stats/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_CONCURRENT_SESSIONS
        value: "4"
      - key: IDLE_TIMEOUT_MINUTES
        value: "15"
      - key: VNC_RESOLUTION
        value: "1280x720x16"
